# Builds the static site and publishes it with GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install fastapi "uvicorn[standard]" pytest httpx
      - run: pip install httpx2 || true   # newest starlette needs it for TestClient; older warns
      - run: cd backend && python -m pytest -q
      - run: cd frontend && npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
