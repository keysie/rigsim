[project]
name = "rigsim"
version = "0.1.0"
description = "Self-hosted simulator for AI inference hosts: hardware, engines, roles, bottlenecks"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
