question = "gpu-vram"
asks = """What VRAM bandwidth does each card reach for reads, writes and copies — and does it move with the power
limit (on a 3090 the memory clock is expected to stay put while the SM clock drops)?"""
feeds = """VRAM storage bandwidth (hw/gpu.py) and its power curve (vram_bandwidth, per load class)."""
method = """Streaming kernels over a 4 GiB buffer (float4 loads with a reduction / float4 stores / both), 3 warm-up
passes, `reps` timed passes; bytes moved / median time."""
image = "cuda"
gpus = "item"
exclusive = true
repeats = 2
sample_ms = 100
timeout_s = 180

[grid]
gpu = ["@all"]
power_w = ["default", 250, 200, 150, 120]
op = ["read", "write", "copy"]

[args]
mib = 4096
reps = 20
cmd = ["probe", "stream", "--op", "{op}", "--mib", "{mib}", "--reps", "{reps}"]

[smoke]
grid = { power_w = ["default"], op = ["read"] }
args = { reps = 3 }
