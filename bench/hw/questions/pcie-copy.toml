question = "pcie-copy"
asks = """What do host <-> card copies reach per slot, one card alone and all cards at once (shared chipset uplink,
the CPU's root complex), in each direction and both at once — and card to card through the CPU?"""
feeds = """PCIe link capacities vs spec (hw/links.py), shared links and router capacities in the machine graph,
duplex behaviour."""
method = """cudaMemcpyAsync with pinned host memory, 512 MiB per transfer, 1 warm-up and `reps` timed transfers per
card; '@together' runs one thread per card with a common start (per-card and aggregate rates). d2d: card i to
card i+1 with cudaMemcpyPeer (peer access where the driver offers it, otherwise staged through the host)."""
image = "nvidia/cuda:12.8.1-devel-ubuntu24.04"
toolkit = "cuda"
gpus = "item"
exclusive = true
repeats = 3
sample_ms = 200
timeout_s = 300

[grid]
gpu = ["@all", "@together"]
dir = ["h2d", "d2h", "bidir", "d2d"]

[args]
mib = 512
reps = 10
cmd = ["probe", "copy", "--dir", "{dir}", "--mib", "{mib}", "--reps", "{reps}"]

[smoke]
grid = { gpu = ["@together"], dir = ["h2d", "bidir"] }
args = { reps = 2 }
