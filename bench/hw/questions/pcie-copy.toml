question = "pcie-copy"
asks = """What do host <-> card copies reach per slot, one card alone and all cards at once (shared chipset uplink,
the CPU's root complex), in each direction and both at once — and card to card through the CPU?"""
feeds = """PCIe link capacities vs spec (hw/links.py), shared links and router capacities in the machine graph,
duplex behaviour; the copy-engine vs SM copy paths."""
method = """NVIDIA nvbandwidth (pinned host memory), JSON output, one test case per item."""
image = "nvbandwidth"
gpus = "all"
exclusive = true
repeats = 3
sample_ms = 200
timeout_s = 900

[grid]
testcase = ["host_to_device_memcpy_ce", "device_to_host_memcpy_ce", "host_to_device_bidirectional_memcpy_ce",
            "device_to_host_bidirectional_memcpy_ce", "host_to_all_memcpy_ce", "all_to_host_memcpy_ce",
            "device_to_device_memcpy_read_ce", "device_to_device_memcpy_write_ce",
            "host_to_device_memcpy_sm", "device_to_host_memcpy_sm"]

[args]
cmd = ["nvb", "-t", "{testcase}"]

[smoke]
grid = { testcase = ["host_to_device_memcpy_ce"] }
