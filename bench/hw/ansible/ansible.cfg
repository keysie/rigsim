[defaults]
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
inject_facts_as_vars = False
gathering = smart
forks = 5

[inventory]
# the AI-SERVER private inventory is an inventory source: never parse its CA material, keys or notes
ignore_patterns = ca
ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .ini, .cfg, .retry, .orig, .crt, .pem, .key

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=6
