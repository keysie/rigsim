---
# Build the probe images from committed sources, push them to the internal registry, write images.lock.json
# (repository path and digest only — no registry host: this repository is public).
#   bench/hw/run.sh images              all probes        bench/hw/run.sh images cuda cpu
- name: hwbench images — build, push, lock
  hosts: "{{ build_host }}"
  gather_facts: false
  vars:
    hw_registry: "{{ hostvars[target][registry_var] }}"
    hw_probes: "{{ probes.split(',') }}"
  tasks:
    - name: Probe sources are committed (an image is built from a known tree only)
      ansible.builtin.command: git -C {{ hw_root }} status --porcelain -- probes/{{ item }}
      loop: "{{ hw_probes }}"
      register: hw_dirty
      delegate_to: localhost
      changed_when: false
      failed_when: hw_dirty.stdout | length > 0

    - name: Source tree hash per probe (the image tag)
      ansible.builtin.command: git -C {{ hw_root }} rev-parse HEAD:bench/hw/probes/{{ item }}
      loop: "{{ hw_probes }}"
      register: hw_trees
      delegate_to: localhost
      changed_when: false

    - name: Build context
      ansible.builtin.tempfile: { state: directory, suffix: -rigsim-hwbench }
      register: hw_ctx

    - name: Copy the probe sources
      ansible.builtin.copy: { src: "{{ hw_root }}/probes/{{ item }}/", dest: "{{ hw_ctx.path }}/{{ item }}/", mode: preserve }
      loop: "{{ hw_probes }}"

    - name: Log in to the registry (credentials from the vault)
      ansible.builtin.shell: printf '%s' "$RT" | docker login --username "$RU" --password-stdin {{ hw_registry }}
      environment:
        RU: "{{ lookup('vars', registry_user_var) }}"
        RT: "{{ lookup('vars', registry_token_var) }}"
      no_log: true
      changed_when: false

    - name: Build and push, then read the pushed digest
      ansible.builtin.shell: >-
        set -e;
        img={{ hw_registry }}/{{ registry_project }}/{{ item.item }}:{{ item.stdout[:16] }};
        docker build --pull -t "$img" {{ hw_ctx.path }}/{{ item.item }} >&2;
        docker push "$img" >&2;
        docker inspect --format '{{ '{{' }}index .RepoDigests 0{{ '}}' }}' "$img"
      args: { executable: /bin/bash }
      loop: "{{ hw_trees.results }}"
      loop_control: { label: "{{ item.item }}" }
      register: hw_built
      changed_when: true

    - name: Lock (repository and digest; merged with the existing lock)
      ansible.builtin.copy:
        dest: "{{ hw_root }}/images.lock.json"
        mode: "0644"
        content: "{{ hw_lock | to_nice_json }}\n"
      vars:
        hw_old: "{{ lookup('file', hw_root ~ '/images.lock.json', errors='ignore') | default('{}', true) | from_json }}"
        hw_lock: >-
          {{ hw_old | combine(dict(hw_built.results | map(attribute='item.item') | zip(
             hw_built.results | map(attribute='stdout') | map('regex_replace', '^[^/]+/(.*)@(sha256:[0-9a-f]+)$',
             '{"repository": "\\1", "digest": "\\2"}') | map('from_json')))) }}
      delegate_to: localhost

  post_tasks:
    - name: Log out and remove the build context
      ansible.builtin.shell: docker logout {{ hw_registry }} >/dev/null 2>&1; rm -rf {{ hw_ctx.path }}
      changed_when: false
      failed_when: false
