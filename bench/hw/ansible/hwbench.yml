---
# rigsim hardware bench: one question on the target, unattended (bench/hw/README.md). Start it with the wrapper,
# which passes AI-SERVER's inventory, this repo's config.local.yml and the vault file:
#   bench/hw/run.sh gpu-gemm --smoke        bench/hw/run.sh gpu-clock-power --smoke-first      ... --check
# What it does: plan validated on the controller -> runner, question, toolkit and run.json to the target ->
# transient unit rigsim-hwbench (hwq.py run: baseline recorded once, every container stopped, one session
# container from a common image set up with the toolkit, items via docker exec, session discarded, restore) ->
# waited for ->
# ALWAYS: unit stopped cleanly, restore again from baseline.json, what the run created removed, everything fetched
# -> the target is asserted to be as found -> archive masked and checked clean on the controller.
- name: hwbench — validate on the controller
  hosts: localhost
  gather_facts: false
  vars:
    smoke: false
  tasks:
    - name: The question exists
      ansible.builtin.stat: { path: "{{ hw_root }}/questions/{{ question }}.toml" }
      register: hw_q
      failed_when: not hw_q.stat.exists

    - name: Expand and validate the plan (changes nothing)
      ansible.builtin.command: >-
        python3 {{ hw_root }}/runner/hwq.py plan {{ hw_root }}/questions/{{ question }}.toml
        {{ '--smoke' if smoke | bool else '' }}
      register: hw_plan_out
      changed_when: false
      check_mode: false            # read-only: --check must validate the plan too

    - name: The question's toolkit
      ansible.builtin.set_fact:
        hw_plan: "{{ hw_plan_out.stdout | from_json }}"
        hw_toolkit: "{{ lookup('file', hw_root ~ '/questions/' ~ question ~ '.toml') | regex_search('(?m)^toolkit\\s*=\\s*\"([^\"]+)\"', '\\1') | first }}"

    - name: The toolkit exists (sources + setup.sh)
      ansible.builtin.stat: { path: "{{ hw_root }}/toolkits/{{ hw_toolkit }}/setup.sh" }
      register: hw_tk
      failed_when: not hw_tk.stat.exists

    - name: The run
      ansible.builtin.debug:
        msg: "{{ question }}{{ ' (smoke)' if smoke | bool else '' }}: {{ hw_plan['items'] }} items before '@all' GPUs expand"

- name: hwbench — run on the target, restore, clean up, fetch
  hosts: "{{ target }}"
  become: true
  gather_facts: false
  vars:
    smoke: false
    fresh: false
    hw_rundir: "{{ rundir_parent }}/{{ question }}{{ '-smoke' if smoke | bool else '' }}"
    hw_toolkit: "{{ hostvars['localhost'].hw_toolkit }}"
    hw_fetch: "{{ results_dir | expanduser }}/{{ question }}{{ '-smoke' if smoke | bool else '' }}-{{ lookup('pipe', 'date -u +%Y%m%d-%H%M') }}"
  tasks:
    - name: Check mode — the run itself does nothing
      ansible.builtin.meta: end_play
      when: ansible_check_mode

    - name: Run it
      block:
        - name: Docker answers
          ansible.builtin.command: docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'
          changed_when: false

        - name: No hwbench unit active already
          ansible.builtin.command: systemctl is-active rigsim-hwbench
          register: hw_active
          failed_when: hw_active.stdout == 'active'
          changed_when: false

        - name: Run directory (one per question; a real run resumes, a smoke run starts over)
          ansible.builtin.file: { path: "{{ hw_rundir }}", state: directory, mode: "0700" }

        - name: Runner and question
          ansible.builtin.copy: { src: "{{ item.src }}", dest: "{{ hw_rundir }}/{{ item.dest }}", mode: "0600" }
          loop:
            - { src: "{{ hw_root }}/runner/hwq.py", dest: hwq.py }
            - { src: "{{ hw_root }}/questions/{{ question }}.toml", dest: question.toml }

        - name: The toolkit (copied into the session container by the runner)
          ansible.builtin.copy:
            src: "{{ hw_root }}/toolkits/{{ hw_toolkit }}/"
            dest: "{{ hw_rundir }}/toolkits/{{ hw_toolkit }}/"
            mode: preserve

        - name: Run configuration
          ansible.builtin.copy:
            dest: "{{ hw_rundir }}/run.json"
            mode: "0600"
            content: >-
              {{ {'toolkits': hw_rundir ~ '/toolkits', 'image_mirror': image_mirror | default(''),
                  'setup_proxy': setup_proxy | default({}), 'gpu_names': gpu_names,
                  'keep_running': keep_running, 'testdir_parent': testdir_parent,
                  'pause_file': hw_rundir ~ '/PAUSE', 'min_free_gb': min_free_gb} | to_nice_json }}

        - name: Start the question as the transient unit rigsim-hwbench (survives this SSH session)
          ansible.builtin.command: >-
            systemd-run --unit rigsim-hwbench --collect --property=KillSignal=SIGTERM --property=TimeoutStopSec=900
            /usr/bin/python3 {{ hw_rundir }}/hwq.py run {{ hw_rundir }}/question.toml --dir {{ hw_rundir }}
            --config {{ hw_rundir }}/run.json {{ '--smoke --fresh' if smoke | bool else ('--fresh' if fresh | bool else '') }}

        - name: Wait until it has finished (checked every minute; pause between items with a PAUSE file)
          ansible.builtin.shell: >-
            systemctl is-active rigsim-hwbench || true;
            /usr/bin/python3 {{ hw_rundir }}/hwq.py status --dir {{ hw_rundir }}
          register: hw_wait
          until: hw_wait.stdout_lines[0] != 'active'
          retries: "{{ (max_hours | int) * 60 }}"
          delay: 60
          changed_when: false
          failed_when: false

      always:
        - name: Stop the unit if it still runs (a clean stop restores before it exits)
          ansible.builtin.command: systemctl stop rigsim-hwbench
          failed_when: false
          changed_when: false

        - name: Restore again from baseline.json (idempotent)
          ansible.builtin.command: /usr/bin/python3 {{ hw_rundir }}/hwq.py restore --dir {{ hw_rundir }}
          register: hw_restore
          failed_when: false

        - name: Remove what the run created (its containers, pulled images no one uses, new volumes, test files)
          ansible.builtin.command: /usr/bin/python3 {{ hw_rundir }}/hwq.py cleanup --dir {{ hw_rundir }}
          register: hw_cleanup
          failed_when: false

        - name: The unit's journal into the run directory
          ansible.builtin.shell: >-
            journalctl -u rigsim-hwbench --no-pager -o short-iso --since '-{{ (max_hours | int) + 1 }}h'
            > {{ hw_rundir }}/journal.txt
          failed_when: false
          changed_when: false

        - name: Files to fetch
          ansible.builtin.find:
            paths: "{{ hw_rundir }}"
            patterns: ["*.json", "*.jsonl", "*.txt", "*.csv", "question.toml"]
            recurse: true
          register: hw_files

        - name: Fetch them to the controller (private until archive.py has masked them)
          ansible.builtin.fetch:
            src: "{{ item.path }}"
            dest: "{{ hw_fetch }}/{{ item.path | relpath(hw_rundir) }}"
            flat: true
          loop: "{{ hw_files.files }}"
          loop_control: { label: "{{ item.path | relpath(hw_rundir) }}" }

        - name: Restore and cleanup report
          ansible.builtin.debug:
            msg: "{{ (hw_restore.stdout_lines | default([])) + (hw_cleanup.stdout_lines | default([])) }}"

    - name: VERIFY the target is as found
      ansible.builtin.assert:
        that: [hw_restore.rc == 0]
        fail_msg: "restore reported problems — see {{ hw_fetch }}/restore.json"

    - name: Hand the fetched directory to the controller
      ansible.builtin.set_fact: { hw_fetched: "{{ hw_fetch }}" }

- name: hwbench — archive on the controller (masked, checked clean)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Mask and pack (fails if anything identifying is left)
      ansible.builtin.command: >-
        python3 {{ hw_root }}/runner/archive.py {{ hostvars[target].hw_fetched }}
        --gpu-names '{{ gpu_names | to_json }}' --hosts '{{ hw_hosts | to_json }}'
      vars:
        hw_hosts: >-
          {{ (groups['all'] + (groups['all'] | map('extract', hostvars) | map(attribute='ansible_host', default='')
              | select | list) + [(image_mirror | default('')).split('/') | first]) | select | unique | list }}
      register: hw_archive
      changed_when: true
      when: not ansible_check_mode and hostvars[target].hw_fetched is defined

    - name: Archive
      ansible.builtin.debug: { msg: "{{ hw_archive.stdout_lines }}" }
      when: hw_archive is not skipped
