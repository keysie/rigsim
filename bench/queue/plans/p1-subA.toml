# GENERATED by plans/gen_phase1.py — edit there, not here. Benchmark phase 1 (docs/bench-plan.md), sub-maker A: vLLM AWQ (#3).
name = "p1-subA"
gpus = [2]                # the temperature guard watches only these (the other queue runs in parallel)

[defaults]
repeats = 1                 # pass 1 screens; pass 2 repeats on the chosen configurations
timeout_s = 3600            # per queue item
ready_timeout_s = 1800
max_attempts = 2
recreate = "always"         # every variant starts cold -> comparable

[smoke]
tasks = 1
max_tokens = 1024
timeout_s = 1200
tps_max_tokens = 32

[guard]
max_gpu_temp_c = 83         # core; GDDR6X is not visible to nvidia-smi on these cards
cooldown_s = 300
min_free_gb = 5

[effort]
key = "reasoning_effort"    # fixed at low everywhere (production); the workloads send template:low

[sampling.engine]           # send nothing: the engines are pinned from infra/models


# ---------------------------------------------------------------------------------------------------- variants

[[variant]]   # production (KV oversubscribed: queueing / preemption)
id = "subA-awq-32k-s4"
service = "vllm-sub"
ctx = 32768
slots = 4
args_set = { "--max-model-len" = "32768", "--max-num-seqs" = "4", "--kv-cache-dtype" = "fp8" }

[[variant]]
id = "subA-awq-32k-s2"
service = "vllm-sub"
ctx = 32768
slots = 2
args_set = { "--max-model-len" = "32768", "--max-num-seqs" = "2", "--kv-cache-dtype" = "fp8" }

[[variant]]
id = "subA-awq-16k-s3"
service = "vllm-sub"
ctx = 16384
slots = 3
args_set = { "--max-model-len" = "16384", "--max-num-seqs" = "3", "--kv-cache-dtype" = "fp8" }

[[variant]]
id = "subA-awq-16k-s4-novis"
service = "vllm-sub"
ctx = 16384
slots = 4
args_set = { "--max-model-len" = "16384", "--max-num-seqs" = "4", "--kv-cache-dtype" = "fp8" }
args_add = ["--limit-mm-per-prompt={\"image\":0,\"video\":0}"]

[[variant]]
id = "subA-awq-32k-s2-novis"
service = "vllm-sub"
ctx = 32768
slots = 2
args_set = { "--max-model-len" = "32768", "--max-num-seqs" = "2", "--kv-cache-dtype" = "fp8" }
args_add = ["--limit-mm-per-prompt={\"image\":0,\"video\":0}"]

[[variant]]   # vision off: one 64K sequence fits (smoke 2026-10-21)
id = "subA-awq-64k-s1-novis"
service = "vllm-sub"
ctx = 65536
slots = 1
args_set = { "--max-model-len" = "65536", "--max-num-seqs" = "1", "--kv-cache-dtype" = "fp8" }
args_add = ["--limit-mm-per-prompt={\"image\":0,\"video\":0}"]
smoke = true


# ---------------------------------------------------------------------------------------------------- workloads

[[workload]]
id = "depth"
kind = "throughput"
fill = [0.25, 0.5, 0.9]
streams = "slots+0,slots+2"
max_tokens = 256
rounds = 1
corpus = "/s,/b,/d"

[[workload]]
id = "ramp"
kind = "throughput"
streams = "ramp+2"
prompt_tokens = 2000
max_tokens = 256
corpus = "/s,/b,/d"

[[workload]]
id = "answerlen"
kind = "tasks"
tasks = "tasks/seed.jsonl"
variants = ["subA-awq-32k-s4"]
smoke_variants = ["subA-awq-64k-s1-novis"]
effort = ["template:low"]
streams = 2
limit = 6
max_tokens = 28672
