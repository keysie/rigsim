# GENERATED by plans/gen_phase1.py — edit there, not here. Benchmark phase 1 (docs/bench-plan.md), sub-maker B: llama.cpp IQ3_S in the strata slot (#1).
name = "p1-subB-g0"
gpus = [0]                # the temperature guard watches only these (the other queue runs in parallel)

[defaults]
repeats = 1                 # pass 1 screens; pass 2 repeats on the chosen configurations
timeout_s = 3600            # per queue item
ready_timeout_s = 900
on_end = "stop"           # leave the slot empty at the end (ops/bench.yml restores guard, then Strata)
max_attempts = 2
recreate = "always"         # every variant starts cold -> comparable

[smoke]
tasks = 1
max_tokens = 1024
timeout_s = 1200
tps_max_tokens = 32

[guard]
max_gpu_temp_c = 83         # core; GDDR6X is not visible to nvidia-smi on these cards
cooldown_s = 300
min_free_gb = 5

[effort]
key = "reasoning_effort"    # fixed at low everywhere (production); the workloads send template:low

[sampling.engine]           # send nothing: the engines are pinned from infra/models


# ---------------------------------------------------------------------------------------------------- variants

[[variant]]   # smoke: llama.cpp in Strata's slot, 2 x 64K
id = "subB-iq3s-64k-np2-mtp-g0"
service = "strata"
ctx = 65536
slots = 2
gpus = [0]
image = "ghcr.io/ggml-org/llama.cpp:${LLAMACPP_CUDA_TAG}"
command = ["-m", "/models/sub/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf", "--mmproj", "/models/sub/mmproj-Qwen3.8-27B-BF16.gguf", "--host", "0.0.0.0", "--port", "8080", "--api-key", "${STRATA_API_KEY}", "--alias", "qwen3.8-27b", "-ngl", "99", "-fa", "on", "-c", "131072", "-np", "2", "-ctk", "q8_0", "-ctv", "q8_0", "--jinja", "--reasoning-format", "deepseek", "--metrics", "--temp", "1.0", "--top-p", "0.95", "--top-k", "20", "--min-p", "0.0", "--spec-type", "draft-mtp", "--spec-draft-n-max", "3"]
compose = { "volumes" = ["${MODELS_DIR}/gguf:/models:ro"], "deploy" = { "resources" = { "reservations" = { "devices" = [{ "driver" = "nvidia", "device_ids" = ["${GPU_MAKER_A:-0}"], "capabilities" = ["gpu"] }] } } } }
compose_replace = ["deploy"]
smoke = true

