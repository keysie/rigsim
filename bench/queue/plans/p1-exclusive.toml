# GENERATED by plans/gen_phase1.py — edit there, not here. Benchmark phase 1 (docs/bench-plan.md), exclusive block (after both queues).
name = "p1-exclusive"
gpus = [0, 1, 2]                # the temperature guard watches only these (the other queue runs in parallel)

[defaults]
repeats = 1                 # pass 1 screens; pass 2 repeats on the chosen configurations
timeout_s = 3600            # per queue item
ready_timeout_s = 2400
max_attempts = 2
recreate = "always"         # every variant starts cold -> comparable

[smoke]
tasks = 1
max_tokens = 1024
timeout_s = 1200
tps_max_tokens = 32

[guard]
max_gpu_temp_c = 83         # core; GDDR6X is not visible to nvidia-smi on these cards
cooldown_s = 300
min_free_gb = 5

[effort]
key = "reasoning_effort"    # fixed at low everywhere (production); the workloads send template:low

[sampling.engine]           # send nothing: the engines are pinned from infra/models


# ---------------------------------------------------------------------------------------------------- variants

[[variant]]   # Strata on all three 3090s (#3 on x8 carries the last layers); vllm-sub stopped
id = "maker3gpu-b2-64k-int8-stream"
service = "strata"
ctx = 65536
slots = 2
strata_args_set = { "--batch" = "2", "--max-context" = "65536", "--kv" = "int8", "--kv-resident" = "32768" }
stop = ["vllm-sub"]
gpus = [0, 1, 2]
strata_config_set = { "gpu" = [0, 1, 2], "layer_split" = "auto" }
compose = { "deploy" = { "resources" = { "reservations" = { "devices" = [{ "driver" = "nvidia", "device_ids" = ["${GPU_MAKER_A:-0}", "${GPU_MAKER_B:-1}", "${GPU_SUB:-2}"], "capabilities" = ["gpu"] }] } } } }
compose_replace = ["deploy"]
strata_args_remove = ["--trim-stage-weights"]
smoke = true

[[variant]]   # Strata on all three 3090s (#3 on x8 carries the last layers); vllm-sub stopped
id = "maker3gpu-b4-32k-int8"
service = "strata"
ctx = 32768
slots = 4
strata_args_set = { "--batch" = "4", "--max-context" = "32768", "--kv" = "int8" }
stop = ["vllm-sub"]
gpus = [0, 1, 2]
strata_config_set = { "gpu" = [0, 1, 2], "layer_split" = "auto" }
compose = { "deploy" = { "resources" = { "reservations" = { "devices" = [{ "driver" = "nvidia", "device_ids" = ["${GPU_MAKER_A:-0}", "${GPU_MAKER_B:-1}", "${GPU_SUB:-2}"], "capabilities" = ["gpu"] }] } } } }
compose_replace = ["deploy"]
strata_args_remove = ["--trim-stage-weights"]

[[variant]]   # scenario B: the 27B AWQ as maker over the two x16 cards; Strata and guard stopped
id = "makerB-vllm-tp2-64k"
service = "vllm-sub"
ctx = 65536
slots = 4
stop = ["strata", "llama-guard"]
gpus = [0, 1]
args_set = { "--max-model-len" = "65536", "--max-num-seqs" = "4", "--tensor-parallel-size" = "2" }
args_add = ["--disable-custom-all-reduce"]
env = { "NCCL_P2P_DISABLE" = "1" }
compose = { "deploy" = { "resources" = { "reservations" = { "devices" = [{ "driver" = "nvidia", "device_ids" = ["${GPU_MAKER_A:-0}", "${GPU_MAKER_B:-1}"], "capabilities" = ["gpu"] }] } } } }
compose_replace = ["deploy"]

[[variant]]   # isolated reference: nothing else runs (size of the parallel queues' interference)
id = "ref-maker-b4-32k"
service = "strata"
ctx = 32768
slots = 4
strata_args_set = { "--batch" = "4", "--max-context" = "32768", "--kv" = "int8" }

[[variant]]   # isolated reference: nothing else runs (size of the parallel queues' interference)
id = "ref-subA-awq-32k-s4"
service = "vllm-sub"
ctx = 32768
slots = 4
args_set = { "--max-model-len" = "32768", "--max-num-seqs" = "4", "--kv-cache-dtype" = "fp8" }


# ---------------------------------------------------------------------------------------------------- workloads

[[workload]]
id = "depth"
kind = "throughput"
fill = [0.25, 0.5, 0.9]
streams = "slots+0,slots+2"
max_tokens = 256
rounds = 1
corpus = "/s,/b,/d"

[[workload]]
id = "ramp"
kind = "throughput"
streams = "ramp+2"
prompt_tokens = 2000
max_tokens = 256
corpus = "/s,/b,/d"
variants = ["ref-*", "makerB-*"]
