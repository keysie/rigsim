# GENERATED by plans/gen_phase1.py — edit there, not here. Benchmark phase 1 (docs/bench-plan.md), sub-maker B: llama.cpp IQ3_S in the vllm-sub slot (#3).
name = "p1-subB-g2"
gpus = [2]                # the temperature guard watches only these (the other queue runs in parallel)

[defaults]
repeats = 1                 # pass 1 screens; pass 2 repeats on the chosen configurations
timeout_s = 3600            # per queue item
ready_timeout_s = 900
max_attempts = 2
recreate = "always"         # every variant starts cold -> comparable

[smoke]
tasks = 1
max_tokens = 1024
timeout_s = 1200
tps_max_tokens = 32

[guard]
max_gpu_temp_c = 83         # core; GDDR6X is not visible to nvidia-smi on these cards
cooldown_s = 300
min_free_gb = 5

[effort]
key = "reasoning_effort"    # fixed at low everywhere (production); the workloads send template:low

[sampling.engine]           # send nothing: the engines are pinned from infra/models


# ---------------------------------------------------------------------------------------------------- variants

[[variant]]   # reference point (also on #1)
id = "subB-iq3s-16k-np6-mtp"
service = "vllm-sub"
ctx = 16384
slots = 6
gpus = [2]
image = "ghcr.io/ggml-org/llama.cpp:${LLAMACPP_CUDA_TAG}"
command = ["-m", "/models/sub/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf", "--mmproj", "/models/sub/mmproj-Qwen3.8-27B-BF16.gguf", "--host", "0.0.0.0", "--port", "8000", "--api-key", "${LOCAL_API_KEY}", "--alias", "qwen3.8-27b", "-ngl", "99", "-fa", "on", "-c", "98304", "-np", "6", "-ctk", "q8_0", "-ctv", "q8_0", "--jinja", "--reasoning-format", "deepseek", "--metrics", "--temp", "1.0", "--top-p", "0.95", "--top-k", "20", "--min-p", "0.0", "--spec-type", "draft-mtp", "--spec-draft-n-max", "3"]
compose = { "volumes" = ["${MODELS_DIR}/gguf:/models:ro"] }
smoke = true

[[variant]]
id = "subB-iq3s-32k-np3"
service = "vllm-sub"
ctx = 32768
slots = 3
gpus = [2]
image = "ghcr.io/ggml-org/llama.cpp:${LLAMACPP_CUDA_TAG}"
command = ["-m", "/models/sub/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf", "--mmproj", "/models/sub/mmproj-Qwen3.8-27B-BF16.gguf", "--host", "0.0.0.0", "--port", "8000", "--api-key", "${LOCAL_API_KEY}", "--alias", "qwen3.8-27b", "-ngl", "99", "-fa", "on", "-c", "98304", "-np", "3", "-ctk", "q8_0", "-ctv", "q8_0", "--jinja", "--reasoning-format", "deepseek", "--metrics", "--temp", "1.0", "--top-p", "0.95", "--top-k", "20", "--min-p", "0.0"]
compose = { "volumes" = ["${MODELS_DIR}/gguf:/models:ro"] }


# ---------------------------------------------------------------------------------------------------- workloads

[[workload]]
id = "depth"
kind = "throughput"
fill = [0.25, 0.5, 0.9]
streams = "slots+0,slots+2"
max_tokens = 256
rounds = 1
corpus = "/s,/b,/d"

[[workload]]
id = "ramp"
kind = "throughput"
streams = "ramp+2"
prompt_tokens = 2000
max_tokens = 256
corpus = "/s,/b,/d"
