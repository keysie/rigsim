# ---------------------------------------------------------------------------------------------------- workloads

[[workload]]
id = "deep-think"
kind = "longtask"
tasks = "tasks/longtask-cat.json"
corpus = "/s,/b,/d"
max_turns = 3
max_tokens = 8192
effort = ["template:low"]
request_timeout_s = 3600
trace = true
fill = 0.7
think_back = true
min_tps = 10
timeout_s = 7200
ladder_eval = true
variants = ["p4-*"]


# pass 4 (user 2026-10-22): add pool workers until writing stops improving — under +3 % on the best so far on two steps
[ladder.cpu1c]
stop_gain_below_pct = 3
consecutive = 2

[ladder.cpu2c]
stop_gain_below_pct = 3
consecutive = 2
