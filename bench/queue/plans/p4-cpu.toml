# GENERATED by plans/gen_phase1.py — edit there, not here. Benchmark phase 1 (docs/bench-plan.md), pass 4 A: Strata's CPU need at high hit rates (pool-worker ladder).
name = "p4-cpu"
gpus = [0, 1]                # the temperature guard watches only these (the other queue runs in parallel)

[defaults]
repeats = 1                 # pass 1 screens; pass 2 repeats on the chosen configurations
timeout_s = 3600            # per queue item
ready_timeout_s = 2400
on_end = "stop"           # leave the slot empty at the end (ops/bench.yml restores guard, then Strata)
max_attempts = 2
recreate = "always"         # every variant starts cold -> comparable

[smoke]
tasks = 1
max_tokens = 1024
timeout_s = 1200
tps_max_tokens = 32

[guard]
max_gpu_temp_c = 83         # core; GDDR6X is not visible to nvidia-smi on these cards
cooldown_s = 300
min_free_gb = 5

[effort]
key = "reasoning_effort"    # fixed at low everywhere (production); the workloads send template:low

[sampling.engine]           # send nothing: the engines are pinned from infra/models


# ---------------------------------------------------------------------------------------------------- variants

[[variant]]   # one card #1: 1 pool worker (cores 1–1)
id = "p4-1c-w1"
service = "strata"
ctx = 131072
slots = 1
strata_args_set = { "--batch" = "1", "--max-context" = "131072", "--kv" = "int8", "--kv-resident" = "32768", "--pool-workers" = "1" }
strata_args_remove = ["--trim-stage-weights", "--remote-expert-opt", "--vram-reserve-later-mib"]
gpus = [0]
env = { "STRATA_WAIT_GPU_USED" = "" }
strata_config_set = { "gpu" = [0], "layer_split" = "auto" }
compose = { "deploy" = { "resources" = { "reservations" = { "devices" = [{ "driver" = "nvidia", "device_ids" = ["${GPU_MAKER_A:-0}"], "capabilities" = ["gpu"] }] } } } }
compose_replace = ["deploy"]
smoke = true
ladder = "cpu1c"
stop = ["llama-guard", "vllm-sub", "llama-rerank", "llama-judge"]

