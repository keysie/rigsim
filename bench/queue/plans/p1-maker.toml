# ---------------------------------------------------------------------------------------------------- workloads

[[workload]]
id = "depth"
kind = "throughput"
fill = [0.25, 0.5, 0.9]
streams = "slots+0,slots+2"
max_tokens = 256
rounds = 1
corpus = "/s,/b,/d"
variants = ["maker-*"]

[[workload]]
id = "ramp"
kind = "throughput"
streams = "ramp+2"
prompt_tokens = 2000
max_tokens = 256
corpus = "/s,/b,/d"
variants = ["maker-*"]

[[workload]]
id = "answerlen"
kind = "tasks"
tasks = "tasks/seed.jsonl"
variants = ["maker-b4-32k-int8"]
smoke_variants = ["maker-b2-128k-k8v4"]
effort = ["template:low"]
streams = 2
limit = 6
max_tokens = 28672

[[workload]]
id = "guardload"
kind = "throughput"
variants = ["guard-*"]
streams = "ramp+0"
prompt_tokens = 1500
max_tokens = 64
corpus = "/s,/b,/d"
