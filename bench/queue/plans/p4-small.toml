# GENERATED by plans/gen_phase1.py — edit there, not here. Benchmark phase 1 (docs/bench-plan.md), pass 4 B: guard, judge and reranker alone on each candidate card / the CPU.
name = "p4-small"
gpus = [0, 1, 2, 3]                # the temperature guard watches only these (the other queue runs in parallel)

[defaults]
repeats = 1                 # pass 1 screens; pass 2 repeats on the chosen configurations
timeout_s = 3600            # per queue item
ready_timeout_s = 900
on_end = "stop"           # leave the slot empty at the end (ops/bench.yml restores guard, then Strata)
max_attempts = 2
recreate = "always"         # every variant starts cold -> comparable

[smoke]
tasks = 1
max_tokens = 1024
timeout_s = 1200
tps_max_tokens = 32

[guard]
max_gpu_temp_c = 83         # core; GDDR6X is not visible to nvidia-smi on these cards
cooldown_s = 300
min_free_gb = 5

[effort]
key = "reasoning_effort"    # fixed at low everywhere (production); the workloads send template:low

[sampling.engine]           # send nothing: the engines are pinned from infra/models


# ---------------------------------------------------------------------------------------------------- variants

[[variant]]   # guard on the 3060: 4 x 8K (today)
id = "guard-3060-8kx4"
service = "llama-guard"
ctx = 8192
slots = 4
args_set = { "-c" = "32768", "-np" = "4" }
args_add = ["--metrics"]
compose = { "deploy" = { "resources" = { "reservations" = { "devices" = [{ "driver" = "nvidia", "device_ids" = ["${GPU_SMALL}"], "capabilities" = ["gpu"] }] } } } }
compose_replace = ["deploy"]
stop = ["llama-guard", "vllm-sub", "llama-rerank", "llama-judge"]
smoke = true

