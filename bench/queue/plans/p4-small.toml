# ---------------------------------------------------------------------------------------------------- workloads

[[workload]]
id = "guard"
kind = "guard"
corpus = "/s,/b,/d"
variants = ["guard-*"]
sizes = [512, 2048, 8192, 16384, 28000]
conc = [1, 2]
repeats = 3
max_tokens = 512
request_timeout_s = 120
timeout_s = 3600

[[workload]]
kind = "judge"
corpus = "/s,/b,/d"
max_tokens = 2048
read_tokens = 3000
judge_timeout_s = 120
request_timeout_s = 600
id = "judge-off"
variants = ["judge-*-16kx2"]
chat_kwargs = { "enable_thinking" = false }
smoke_skip = true
history = [4096, 12288]
tool_turns = [0, 2, 5]
conc = [1, 2]
repeats = 2
timeout_s = 3600

[[workload]]
kind = "judge"
corpus = "/s,/b,/d"
max_tokens = 2048
read_tokens = 3000
judge_timeout_s = 120
request_timeout_s = 600
id = "judge-low"
variants = ["judge-*"]
chat_kwargs = { "enable_thinking" = true, "low_effort" = true, "reasoning_effort" = "low" }
history = [4096, 12288]
tool_turns = [0, 2, 5]
conc = [1, 2]
repeats = 2
timeout_s = 5400

[[workload]]
kind = "judge"
corpus = "/s,/b,/d"
max_tokens = 2048
read_tokens = 3000
judge_timeout_s = 120
request_timeout_s = 600
id = "judge-default"
variants = ["judge-*-16kx2"]
chat_kwargs = { "enable_thinking" = true }
smoke_skip = true
history = [4096, 12288]
tool_turns = [0, 2, 5]
conc = [1]
repeats = 1
timeout_s = 5400

[[workload]]
id = "rerank-light"
kind = "rerank"
corpus = "/s,/b,/d"
variants = ["rerank-cpu-t1", "rerank-cpu-t2"]
shapes = ["memory:50:40:30", "tools:50:150:30", "web:30:100:20", "longquery:50:40:400"]
conc = [1]
repeats = 1
request_timeout_s = 600
timeout_s = 3600

[[workload]]
id = "rerank"
kind = "rerank"
corpus = "/s,/b,/d"
smoke_skip = true
variants = ["rerank-cpu-t4*", "rerank-cpu-t6", "rerank-cpu-t8", "rerank-cpu-t10", "rerank-3060", "rerank-3090"]
shapes = ["memory:50:40:30", "tools:50:150:30", "web:30:100:20", "longquery:50:40:400"]
conc = [1, 4]
repeats = 2
request_timeout_s = 600
timeout_s = 3600

[[workload]]
id = "rerank-sweep"
kind = "rerank"
corpus = "/s,/b,/d"
variants = ["rerank-*"]
shapes = ["sweep:64:40:40"]
conc = [1, 4]
duration_s = 60
request_timeout_s = 600
timeout_s = 1800
