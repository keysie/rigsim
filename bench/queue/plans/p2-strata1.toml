tasks = "tasks/longtask-cat.json"
corpus = "/s,/b,/d"
fill = 0
max_turns = 40
max_tokens = 8192
min_tps = 0
effort = ["template:low"]
request_timeout_s = 3600
timeout_s = 10800
until_fill = 0.9
variants = ["strata1-b1-128k-w32k-mtp", "strata1-b1-128k-w32k-mtp-lastok"]


# ---------------------------------------------------------------------------------------------------- ladders
[ladder.mtp1]                # user 2026-10-21: stop at 90 % of the calibrated RAM bandwidth or below 15 tok/s twice
stop_membw_pct = 90
stop_tps_below = 15
consecutive = 2

[ladder.nomtp2]
stop_membw_pct = 90
stop_tps_below = 15
consecutive = 2
